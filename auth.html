<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>zahnarztKORN – Google Auth</title>
<style>
body{font-family:system-ui,sans-serif;background:#2D5A3D;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;border-radius:14px;padding:32px 28px;text-align:center;max-width:320px;width:100%}
h2{color:#2D5A3D;margin-bottom:8px}
p{color:#666;font-size:14px;margin-bottom:20px}
.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#2D5A3D;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2>zahnarztKORN</h2>
  <p id="msg">Google Drive wird verbunden...</p>
</div>
<script>
// This page receives the OAuth token and passes it back to the app
var hash = window.location.hash;
if(hash && hash.indexOf('access_token=') >= 0) {
  var params = {};
  hash.substring(1).split('&').forEach(function(p) {
    var kv = p.split('=');
    if(kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
  });
  if(params.access_token) {
    // Store token in localStorage so the app can pick it up
    try {
      localStorage.setItem('korn_gdrive_token', params.access_token);
      localStorage.setItem('korn_gdrive_token_exp', Date.now() + (parseInt(params.expires_in||3600)*1000));
      document.getElementById('msg').textContent = '✓ Verbunden! Sie werden zurückgeleitet...';
    } catch(e) {
      document.getElementById('msg').textContent = 'Fehler: ' + e.message;
    }
    // Redirect back to app after short delay
    setTimeout(function() {
      window.location.href = 'https://kaikorn.github.io/zahnarztKORN-Steriprotokolle/';
    }, 1200);
  } else {
    document.getElementById('msg').textContent = 'Fehler: Kein Token erhalten.';
  }
} else {
  // No token - redirect to app
  window.location.href = 'https://kaikorn.github.io/zahnarztKORN-Steriprotokolle/';
}
</script>
</body>
</html>
