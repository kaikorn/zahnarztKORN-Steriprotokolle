*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
body{background:#F4F1EC;min-height:100vh}
#pin-screen{position:fixed;inset:0;background:#2D5A3D;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:30px}
.hdr{background:#2D5A3D;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.hdr-title{color:#fff;font-size:17px;font-weight:600}
.hdr-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}
.hdr-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;color:#fff;font-size:13px;cursor:pointer}
.pad{padding:13px}
.sec-hd{display:flex;align-items:center;gap:8px;margin:14px 0 9px}
.sec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sec-txt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}

.tile-title{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:1px;line-height:1.3}

.badge{position:absolute;top:7px;right:7px;border-radius:20px;padding:1px 6px;font-size:10px;font-weight:700;color:#fff}
.lbl{display:block;font-size:10px;font-weight:700;color:#666;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.fi{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;outline:none;margin-bottom:11px;box-sizing:border-box}
.fi:focus{border-color:#2D5A3D}
textarea.fi{resize:vertical;min-height:65px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}

.pill.on{background:#2D5A3D;border-color:#2D5A3D;color:#fff}

.cbr{display:flex;align-items:center;gap:9px;padding:8px 0;cursor:pointer;border-bottom:1px solid #f0ede8}
.cbr:last-child{border-bottom:none}
.cbb{width:22px;height:22px;border-radius:5px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.cbb.on{background:#2D5A3D;border-color:#2D5A3D}
canvas{width:100%;height:90px;border:1.5px solid #ddd;border-radius:8px;background:#fafaf8;cursor:crosshair;touch-action:none;display:block}
.save-btn{width:100%;padding:12px;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:13px;background:#2D5A3D}

.warn-box{background:#fff8e1;border:1.5px solid #f0c040;border-radius:8px;padding:9px 13px;margin-bottom:11px}
.lernende-box{background:#fff8e1;border:1.5px solid #f0c040;border-radius:8px;padding:10px 13px;margin-top:13px;display:flex;align-items:center;gap:9px;cursor:pointer}
.cam-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:#fff;border:1.5px dashed #aaa;border-radius:8px;font-size:13px;color:#555;cursor:pointer;margin-bottom:9px}

.prt-hdr{background:#2D5A3D;padding:11px 14px;display:flex;gap:9px;align-items:center}

.prt-btn{padding:7px 13px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.sel-bar{background:#e8f0eb;border-radius:9px;padding:9px 13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2D5A3D}
@media print{.prt-hdr{display:none!important}button{display:none!important}}
</style>

<body>

<script>
// ── PIN ──────────────────────────────────────────────────────────────────────
document.getElementById('pin-btn').addEventListener('click', function() {
  var val = document.getElementById('pin-input').value.trim();
  if (val === '8820') {
    document.getElementById('pin-screen').style.display = 'none';
  } else {

  }
});
document.getElementById('pin-input').addEventListener('keyup', function(e) {
  if (e.key === 'Enter') document.getElementById('pin-btn').click();
  if (this.value.length === 4) document.getElementById('pin-btn').click();
});

// ── Data ─────────────────────────────────────────────────────────────────────
var STORE = 'korn_zahnarzt_v2';
var G='#2D5A3D', BR='#7A5C3D', PU='#6B4A9E', OR='#C06A1A';

var TL = {
  siegelgeraet:'Siegelgerät', raumtemperatur:'Raumtemperatur',
  sterilisator:'SteriEuronda E10', reinigung:'Reinigung Fussboden',
  pflegegeraet:'Pflegegerät Assistina', reinigung_sterilisator:'Reinigungs-Sterilisator Lisa',
  melatherm:'Reinigung MELAtherm', ablaufdaten:'Ablaufdaten & Sauberkeit',
  datensicherung:'Datensicherung', buerste:'Austausch Bürste/Handschuhe',
  sympronadeln:'Sympronadeln austauschen', kanister:'Rückverfolgbarkeit Kanister',
  ultraschall:'Fehlerhafte Waschgänge MELAtherm',
  ultraschall_test:'Ultraschall Test',
  fehler_steri:'Fehlerhafte Sterigänge'
};
var TC = {
  siegelgeraet:G, raumtemperatur:G, sterilisator:G, reinigung:G,
  pflegegeraet:BR, reinigung_sterilisator:BR, melatherm:BR, ablaufdaten:BR, datensicherung:BR,
  buerste:PU, sympronadeln:PU, kanister:OR, ultraschall:OR,
  ultraschall_test:BR,
  fehler_steri:G
};
var SN = {
  siegelgeraet:{name:'Eurosel 2001 Plus', sn:'SN GDH201720'},
  sterilisator:{name:'Euronda E10', sn:'EXM240031-27.1.2025'},
  reinigung_sterilisator:{name:'W&H Lisa 517', sn:'SN13001'},
  pflegegeraet:{name:'W&H Assistina 3x3', sn:'SN07159'},
  melatherm:{name:'Melag MELAtherm 10', sn:'SN 202110-DTA1067'},
  ultraschall:{name:'SONICA', sn:'SN 2021016821'}
};
var KM = {
  date:'Datum', time:'Uhrzeit', geraet_sn:'Geräte-SN', status:'Status', art:'Programm',
  ort:'Ort', ist:'Ist °C', min:'Min °C', max:'Max °C', bemerkung:'Bemerkung',
  massnahme:'Massnahme', warum:'Warum', programm:'Programm', chargennr:'Chargennummer',
  erledigt:'Erledigt', done:'Durchgeführt', lernende:'Freigabe Lernende',
  innen:'Innen gereinigt', tank:'Tank gereinigt', aussen:'Aussen gereinigt',
  siebe:'Siebe/Arme gereinigt', lager:'Lager', apotheke:'Apotheke',
  notfall:'Notfallkoffer', instrumente:'Instrumente', produkt:'Produktname',
  verfall:'Verfallsdatum', oeffnung:'Öffnungsdatum',
  josafe:'Josafe nicht gewaschen', fehler:'Fehlermeldung/Störung',
  techniker:'Techniker kontaktiert', programm_frei:'Programm (frei)',
  naechster:'Nächster Austausch',
  beschreibung:'Beschreibung',
  erfolgreich:'Test erfolgreich',
  nicht_erfolgreich:'Test nicht erfolgreich'
};

var state = {
  view:'dash', entries:[], form:null, fd:{}, sig:null,
  sel:{}, archFilter:'all', printEntries:null
};
var sigCanvas, sigCtx, drawing = false;

function today(){ return new Date().toISOString().split('T')[0]; }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function fmtD(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function makeFilename(e){ var d=e.data&&e.data.date||today(); var n=(TL[e.type]||e.type).replace(/\s+/g,'-').replace(/[&\/\\#,+()$~%'"]/g,''); return d+'_'+n; }
function countFor(t){ return state.entries.filter(function(e){ return e.type===t; }).length; }
function getFiltered(){
  if(state.archFilter==='sterilisator_standard') return state.entries.filter(function(e){ return e.type==='sterilisator' && !e.data.lernende; });
  if(state.archFilter==='sterilisator_lernende') return state.entries.filter(function(e){ return e.type==='sterilisator' && !!e.data.lernende; });
  if(state.archFilter==='all') return state.entries;
  return state.entries.filter(function(e){ return e.type===state.archFilter; });
}

function showDriveStatus(){
  alert('Google Drive: Verbunden\nOrdner-ID: '+GDRIVE_CONFIG.folderId+'\nProtokolle werden automatisch hochgeladen beim Speichern.');
}

function loadData(){ checkUrlToken(); try{ var s=localStorage.getItem(STORE); state.entries=s?JSON.parse(s):[]; }catch(e){ state.entries=[]; } render(); }
function saveData(){ try{ localStorage.setItem(STORE,JSON.stringify(state.entries)); }catch(e){} }

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  if(state.printEntries){ renderPrint(); return; }
  if(state.form){ renderForm(); return; }
  if(state.view==='archive'){ renderArchive(); return; }
  renderDash();
}


function getAmpel(type) {
  // Find last entry of this type
  var last = state.entries.find(function(e){ return e.type===type; });
  if(!last || !last.data || !last.data.date) return null;
  var lastDate = new Date(last.data.date);
  var nextDate = new Date(lastDate);
  nextDate.setMonth(nextDate.getMonth() + 3);
  var now = new Date();
  var daysLeft = Math.round((nextDate - now) / (1000*60*60*24));
  var d = nextDate.getDate().toString().padStart(2,'0')+'.'+
           (nextDate.getMonth()+1).toString().padStart(2,'0')+'.'+
           nextDate.getFullYear();
  if(daysLeft < 0)  return {color:'#c0392b', label:'Überfällig! Nächster: '+d};
  if(daysLeft <= 14) return {color:'#e67e22', label:'Bald fällig: '+d};
  return {color:'#27ae60', label:'Nächster: '+d};
}

function makeTile(p){
  var c=countFor(p.k), bc=TC[p.k]||G;
  return '<button class="tile" onclick="openForm(\''+p.k+'\')" style="border-color:'+bc+'">'
    +'<span class="tile-icon">'+p.i+'</span>'
    +'<div class="tile-title">'+p.t+'</div>'
    +'<div class="tile-sub">'+p.s+'</div>'
    +(c>0?'<div class="badge" style="background:'+bc+'">'+c+'</div>':'')+
    '</button>';
}

function makeSec(lbl,col,items){
  return '<div class="sec-hd"><div class="sec-dot" style="background:'+col+'"></div>'
    +'<span class="sec-txt" style="color:'+col+'">'+lbl+'</span>'
    +'<div class="sec-line"></div></div>'
    +'<div class="grid">'+items.map(makeTile).join('')+'</div>';
}

function renderDash(){
  state.view='dash';
  var daily=[
    {k:'siegelgeraet',i:'🔐',t:'Siegelgerät',s:'Seal Check | SN GDH201720'},
    {k:'raumtemperatur',i:'🌡️',t:'Raumtemperatur',s:'Apotheke / OP 2'},
    {k:'sterilisator',i:'⚗️',t:'SteriEuronda E10',s:'Zykluskontrolle | EXM240031'},
    {k:'reinigung',i:'🧹',t:'Reinigung Fussboden',s:'Gesamte Praxis'}
  ];
  var weekly=[
    {k:'pflegegeraet',i:'🦷',t:'Pflegegerät Assistina',s:'W&H Assistina | SN07159'},
    {k:'reinigung_sterilisator',i:'🔧',t:'Reinigungs-Sterilisator Lisa',s:'Wöchentlich | SN13001'},
    {k:'melatherm',i:'💧',t:'Reinigung MELAtherm',s:'SN 202110-DTA1067'},
    {k:'ablaufdaten',i:'📦',t:'Ablaufdaten & Sauberkeit',s:'4-Bereiche Kontrolle'},
    {k:'datensicherung',i:'💾',t:'Datensicherung',s:'Wöchentlich'},
    {k:'ultraschall_test',i:'🔬',t:'Ultraschall Test',s:'Wöchentlich – montags'}
  ];
  var quarterly=[
    {k:'buerste',i:'🧤',t:'Austausch Bürste/Handschuhe',s:'Alle 3 Monate'},
    {k:'sympronadeln',i:'💉',t:'Sympronadeln austauschen',s:'Alle 3 Monate'}
  ];
  var bedarf=[
    {k:'kanister',i:'🗂️',t:'Rückverfolgbarkeit Kanister',s:'Bei Bedarf'},
    {k:'ultraschall',i:'🔊',t:'Fehlerhafte Waschgänge MELAtherm',s:'Bei Bedarf | SN 2021016821'},
    {k:'fehler_steri',i:'⚠️',t:'Fehlerhafte Sterigänge',s:'Bei Bedarf'}
  ];
  document.getElementById('app').innerHTML=
    '<div class="hdr"><div><div class="hdr-title">zahnarztKORN</div>'
    +'<div class="hdr-sub">Protokollführung · '+fmtD(today())+'</div></div>'
    +'<button class="hdr-btn" onclick="goArchive()">Archiv ('+state.entries.length+')</button>'
    +(isGDriveConfigured()?'<button class="hdr-btn" style="background:rgba(255,255,255,.1)" onclick="showDriveStatus()">☁️</button>':'')
    +'</div>'
    +'<div class="pad">'
    +makeSec('Täglich',G,daily)
    +makeSec('Wöchentlich',BR,weekly)
    +makeSec('Alle 3 Monate',PU,quarterly)
    +makeSec('Bei Bedarf',OR,bedarf)
    +'<p style="text-align:center;margin-top:24px;font-size:10px;color:#ccc">zahnarztKORN Protokollführung</p>'
    +'</div>';
}

// ── Form ──────────────────────────────────────────────────────────────────────
function sfd(k,v){ state.fd[k]=v; }
function tpill(k,v){ state.fd[k]=(state.fd[k]===v?null:v); render(); }
function tfd(k){ state.fd[k]=!state.fd[k]; render(); }

function openForm(t){
  var sni=SN[t];
  state.form=t; state.fd={date:today(),time:nowTime()};
  if(sni) state.fd.geraet_sn=sni.name+' | '+sni.sn;
  state.sig=null; render();
}
function closeForm(){ state.form=null; render(); }
function goArchive(){ state.view='archive'; state.sel={}; render(); }
function goDash(){ state.view='dash'; render(); }
function setFilter(v){ state.archFilter=v; state.sel={}; render(); }
function closePrint(){ state.printEntries=null; render(); }
function viewEntry(id){ var e=state.entries.find(function(x){return x.id===id;}); if(e){state.printEntries=[e]; render();} }
function viewAll(){ state.printEntries=getFiltered(); render(); }
function viewSel(){ var s=state.entries.filter(function(e){return state.sel[e.id];}); if(s.length>0){state.printEntries=s; render();} }
function toggleSel(id){ state.sel[id]=!state.sel[id]; render(); }
function selAll(){ getFiltered().forEach(function(e){state.sel[e.id]=true;}); render(); }
function selNone(){ state.sel={}; render(); }
function delEntry(id){ if(!confirm('Protokoll löschen?'))return; state.entries=state.entries.filter(function(e){return e.id!==id;}); delete state.sel[id]; saveData(); render(); }
function delSel(){ var ids=Object.keys(state.sel).filter(function(k){return state.sel[k];}); if(!ids.length)return; if(!confirm(ids.length+' Protokolle löschen?'))return; state.entries=state.entries.filter(function(e){return ids.indexOf(String(e.id))<0;}); state.sel={}; saveData(); render(); }
function deleteAll(){ var f=getFiltered(); if(!f.length)return; if(!confirm('Alle '+f.length+' löschen?'))return; var ids=f.map(function(e){return e.id;}); state.entries=state.entries.filter(function(e){return ids.indexOf(e.id)<0;}); state.sel={}; saveData(); render(); }

function renderForm(){
  var t=state.form, fd=state.fd, col=TC[t]||G;
  var sni=SN[t];
  var snBar=sni?'<div class="sn-bar">'+sni.name+' | '+sni.sn+'</div>':'';
  var DT='<div class="g2"><div><div class="lbl">Datum</div><input class="fi" type="date" value="'+(fd.date||'')+'" oninput="sfd(\'date\',this.value)"></div>'
    +'<div><div class="lbl">Uhrzeit</div><input class="fi" type="time" value="'+(fd.time||'')+'" oninput="sfd(\'time\',this.value)"></div></div>';

  function inp(k,tp,ph){ return '<input class="fi" type="'+(tp||'text')+'" value="'+(fd[k]||'')+'" placeholder="'+(ph||'')+'" oninput="sfd(\''+k+'\',this.value)">'; }
  function sel(k,opts){ return '<select class="fi" onchange="sfd(\''+k+'\',this.value)">'+opts.map(function(o){return'<option value="'+o+'"'+(fd[k]===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'; }
  function pills(k,opts){ return '<div class="pills">'+opts.map(function(o){return'<div class="pill'+(fd[k]===o?' on':'')+'" onclick="tpill(\''+k+'\',\''+o+'\')">'+o+'</div>';}).join('')+'</div>'; }
  function chk(k,lb){ var on=!!fd[k]; return '<div class="cbr" onclick="tfd(\''+k+'\')"><div class="cbb'+(on?' on':'')+'">'+( on?'<svg width="11" height="11" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>':'')+' </div><span style="font-size:13px;color:#1a1a1a;line-height:1.3">'+lb+'</span></div>'; }
  function txta(k,ph){ return '<textarea class="fi" placeholder="'+(ph||'')+'" oninput="sfd(\''+k+'\',this.value)">'+(fd[k]||'')+'</textarea>'; }
  function cw(inner){ return '<div class="chk-wrap">'+inner+'</div>'; }
  function camBtn(){ return '<button class="cam-btn" onclick="triggerCam()">📷 Foto aufnehmen</button>'+(fd.foto?'<img src="'+fd.foto+'" style="width:100%;border-radius:8px;border:1px solid #ddd;margin-bottom:8px;display:block"><button onclick="sfd(\'foto\',null);render()" style="font-size:11px;color:#c0392b;background:none;border:none;cursor:pointer;margin-bottom:9px;display:block">✕ Foto entfernen</button>':''); }

  function lernendeBox(){
    var isOn=!!fd.lernende;
    var archiv=isOn?'Archiv: SteriEuronda > Freigaben Lernende':'Archiv: SteriEuronda > Standard Freigaben';
    var cbbCls=isOn?' on':'';
    var chkSvg=isOn?'<svg width="11" height="11" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>':'';
    return '<div class="lernende-box" onclick="tfd(\'lernende\')">'
      +'<div class="cbb'+cbbCls+'" style="border-color:'+(isOn?'#f0c040':'#ccc')+';background:'+(isOn?'#f0c040':'#fff')+'">'+chkSvg+'</div>'
      +'<div><div style="font-size:13px;color:#1a1a1a;font-weight:600">Freigabe durch Lernende</div>'
      +'<div style="font-size:10px;color:#b7860b;margin-top:2px">'+archiv+'</div></div></div>';
  }

  var body='';
  if(t==='siegelgeraet') body=DT+snBar+'<div class="lbl">Seal Check Status</div>'+pills('status',['OK','Nicht OK'])+(fd.status==='Nicht OK'?'<div class="lbl">Bemerkung</div>'+txta('bemerkung','Beschreibung...'):'');

// ── Google Drive Config ───────────────────────────────────────────────────────
var GDRIVE_CONFIG = {
  clientId: '683388069723-kp88ve96ruc221b16coliali8kq0osg8.apps.googleusercontent.com',
  folderId: '15LGv_Utc7mGIKQbByrg33N8-8SbRcRC1',
  scopes: 'https://www.googleapis.com/auth/drive.file',
  redirectUri: 'https://kaikorn.github.io'
};

var gdriveToken = null;

function isGDriveConfigured() { return true; }

function getStoredToken() {
  try {
    var t = sessionStorage.getItem('gdrive_token');
    var exp = sessionStorage.getItem('gdrive_token_exp');
    if(t && exp && Date.now() < parseInt(exp)) return t;
    sessionStorage.removeItem('gdrive_token');
    sessionStorage.removeItem('gdrive_token_exp');
  } catch(e) {}
  return null;
}

function checkUrlToken() {
  // Check if we're returning from Google OAuth with a token in the hash
  var hash = window.location.hash;
  if(hash && hash.indexOf('access_token=') >= 0) {
    var params = {};
    hash.substring(1).split('&').forEach(function(p) {
      var kv = p.split('=');
      params[kv[0]] = decodeURIComponent(kv[1]||'');
    });
    if(params.access_token) {
      gdriveToken = params.access_token;
      var exp = Date.now() + (parseInt(params.expires_in||3600) * 1000);
      try {
        sessionStorage.setItem('gdrive_token', gdriveToken);
        sessionStorage.setItem('gdrive_token_exp', exp);
        // Save pending entry if exists
        var pending = sessionStorage.getItem('gdrive_pending');
        if(pending) {
          sessionStorage.removeItem('gdrive_pending');
          var entry = JSON.parse(pending);
          uploadToGDrive(entry, function(ok, info) {
            if(ok) showGDriveSuccess(info);
          });
        }
      } catch(e) {}
      // Clean URL
      history.replaceState(null, '', window.location.pathname);
    }
  }
}

function gdriveLogin(callback) {
  // Check session storage first
  var stored = getStoredToken();
  if(stored) { gdriveToken = stored; callback(gdriveToken); return; }
  if(gdriveToken) { callback(gdriveToken); return; }
  // Redirect to Google OAuth
  var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth'
    + '?client_id=' + GDRIVE_CONFIG.clientId
    + '&redirect_uri=' + encodeURIComponent(GDRIVE_CONFIG.redirectUri)
    + '&response_type=token'
    + '&scope=' + encodeURIComponent(GDRIVE_CONFIG.scopes)
    + '&prompt=select_account';
  window.location.href = authUrl;
}

function buildPdfHtml(entry) {
  var label = TL[entry.type] || entry.type;
  var sni = SN[entry.type];
  var rows = Object.entries(entry.data || {}).filter(function(kv){ return kv[0] !== 'foto'; }).map(function(kv){
    var v = typeof kv[1] === 'boolean' ? (kv[1] ? 'Ja' : 'Nein') : (kv[1] || '—');
    return '<tr><td style="padding:5px 8px;border-bottom:1px solid #eee;color:#666;font-size:13px;width:45%">'+(KM[kv[0]]||kv[0])+'</td>'
      +'<td style="padding:5px 8px;border-bottom:1px solid #eee;font-size:13px;font-weight:500">'+v+'</td></tr>';
  }).join('');
  var foto = entry.data && entry.data.foto
    ? '<div style="margin-top:12px"><p style="font-size:11px;color:#888;margin-bottom:5px">Foto:</p><img src="'+entry.data.foto+'" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:6px;border:1px solid #ddd"></div>' : '';
  var sig = entry.sig
    ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee"><p style="font-size:11px;color:#888;margin-bottom:4px">Unterschrift:</p><img src="'+entry.sig+'" style="height:55px;border-radius:4px;border:1px solid #ddd"></div>' : '';
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'
    +'body{font-family:Georgia,serif;padding:36px;max-width:660px;margin:0 auto}'
    +'h1{font-size:20px;margin-bottom:4px}h2{font-size:13px;color:#666;font-weight:normal;margin-bottom:18px;font-family:system-ui}'
    +'table{width:100%;border-collapse:collapse}'
    +'</style></head><body>'
    +'<h1>zahnarztKORN — '+label+'</h1>'
    +'<h2>'+fmtD(entry.data && entry.data.date)+' · '+(entry.data && entry.data.time || '')+(sni?' · '+sni.name+' | '+sni.sn:'')+'</h2>'
    +'<table>'+rows+'</table>'+foto+sig
    +'<p style="margin-top:20px;font-size:10px;color:#ccc;font-family:system-ui">zahnarztKORN Protokollführung</p>'
    +'</body></html>';

function showGDriveSuccess(fname) {
  var msg = document.createElement('div');
  msg.textContent = '✓ In Google Drive gespeichert: ' + fname;
  msg.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;font-family:system-ui;white-space:nowrap';
  document.body.appendChild(msg);
  setTimeout(function(){if(msg.parentNode)msg.remove();}, 4000);
}

function uploadToGDrive(entry, callback) {
  if (!isGDriveConfigured()) { if(callback) callback(false, 'nicht konfiguriert'); return; }
  var stored = getStoredToken();
  if(stored) gdriveToken = stored;
  if(!gdriveToken) {
    // Save entry and redirect to login
    try { sessionStorage.setItem('gdrive_pending', JSON.stringify(entry)); } catch(e) {}
    gdriveLogin(function(){});
    return;
  }
  gdriveLogin(function(token) {
    var fname = makeFilename(entry) + '.html';
    var content = buildPdfHtml(entry);
    var metadata = {
      name: fname,
      mimeType: 'text/html',
      parents: [GDRIVE_CONFIG.folderId]
    };
    var boundary = '-------314159265358979323846';
    var body = '--' + boundary + '\r\n'
      + 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
      + JSON.stringify(metadata) + '\r\n'
      + '--' + boundary + '\r\n'
      + 'Content-Type: text/html\r\n\r\n'
      + content + '\r\n'
      + '--' + boundary + '--';
    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.id) {
        console.log('Google Drive Upload OK:', fname);
        if(callback) callback(true, fname);
      } else {
        console.error('Drive error:', data);
        if(callback) callback(false, data.error && data.error.message);
      }
    })
    .catch(function(err){
      console.error('Drive upload failed:', err);
      if(callback) callback(false, err.message);
    });
  });
}

  var btn=document.getElementById('save-btn');
  if(btn){btn.disabled=true;btn.textContent='Wird gespeichert...';}
  var entry={id:Date.now(),type:state.form,data:Object.assign({},state.fd),sig:state.sig,at:new Date().toISOString()};
  state.entries.unshift(entry); saveData();
  state.form=null; state.printEntries=[entry]; render();
  // Automatischer Google Drive Upload
  if(isGDriveConfigured()){
    uploadToGDrive(entry, function(ok, info){
      if(ok){
        showGDriveSuccess(info);
      } else {
        console.warn('Google Drive Upload nicht möglich:', info);
      }
    });
  }
}
function initSig(){
  sigCanvas=document.getElementById('sig-canvas'); if(!sigCanvas)return;
  sigCtx=sigCanvas.getContext('2d'); drawing=false;
  function getP(e,c){var r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height,s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*sx,y:(s.clientY-r.top)*sy};}
  sigCanvas.onmousedown=function(e){drawing=true;var p=getP(e,sigCanvas);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  sigCanvas.onmousemove=function(e){if(!drawing)return;sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.strokeStyle='#1a1a1a';var p=getP(e,sigCanvas);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();};
  sigCanvas.onmouseup=sigCanvas.onmouseleave=function(){drawing=false;if(sigCanvas)state.sig=sigCanvas.toDataURL();};
  sigCanvas.ontouchstart=function(e){e.preventDefault();drawing=true;var p=getP(e,sigCanvas);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  sigCanvas.ontouchmove=function(e){e.preventDefault();if(!drawing)return;sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.strokeStyle='#1a1a1a';var p=getP(e,sigCanvas);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();};
  sigCanvas.ontouchend=function(){drawing=false;if(sigCanvas)state.sig=sigCanvas.toDataURL();};
}
function clearSig(){if(sigCtx&&sigCanvas)sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);state.sig=null;}
function triggerCam(){
  var input=document.getElementById('cam-input');
  input.onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){state.fd.foto=ev.target.result;render();};r.readAsDataURL(file);input.value='';};
  input.click();
}

loadData();
</script>
